<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Wave</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./src/styles/style.css">
</head>

<body class="bg-black text-white min-h-screen flex items-center justify-center">
    <main class="w-full max-w-md px-6">
        <section class="bg-neutral-900 rounded-2xl p-8 shadow-2xl">
            <div class="flex flex-col items-center mb-8">
                <img src="./src/assets/img/note.jpg" alt="Logo del reproductor" class="w-20 h-20 rounded-2xl object-cover mb-4">
                <h1 class="text-2xl font-bold">Sound Wave</h1>
                <p class="text-zinc-400 text-sm mt-2">Inicia sesión para continuar</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm text-zinc-300 mb-2">Correo electrónico</label>
                    <input 
                        id="email" 
                        name="email" 
                        type="email" 
                        required 
                        autocomplete="email"
                        class="w-full bg-neutral-800 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-pink-600"
                        placeholder="usuario@correo.com"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm text-zinc-300 mb-2">Contraseña</label>
                    <input 
                        id="password" 
                        name="password" 
                        type="password" 
                        required 
                        autocomplete="current-password"
                        class="w-full bg-neutral-800 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-pink-600"
                        placeholder="Contraseña"
                    >
                </div>

                <p id="login-error" class="hidden text-sm text-red-400">El correo o la contraseña no son correctos.</p>
                <button 
                    type="submit"
                    class="w-full rounded-lg py-3 font-semibold bg-linear-to-br from-pink-600 to-indigo-800 hover:opacity-90 transition">
                    Iniciar sesión
                </button>
            </form>

            <p class="text-center text-xs text-zinc-500 mt-6">Usuario de prueba: demo@music.com / 123456</p>
        </section>
    </main>

    <script type="module" src="./src/js/auth/auth.js"></script>
</body>

</html>
