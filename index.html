<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Musical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .slider-vertical {
            writing-mode: vertical-lr;
            direction: rtl;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: 20px;
            height: 100%;
            min-height: 100px;
            max-height: 150px;
            padding: 0;
            margin: 0;
            outline: none;
        }

        .slider-vertical::-webkit-slider-runnable-track {
            width: 12px;
            height: 100%;
            background: #1e2738;
            border-radius: 9999px;
            margin: 0 auto;
        }

        .slider-vertical::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.5), 0 2px 4px rgba(0, 0, 0, 0.5);
            margin-left: -3px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .slider-vertical:hover::-webkit-slider-thumb {
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.8), 0 2px 6px rgba(0, 0, 0, 0.6);
            transform: scale(1.1);
        }

        .slider-vertical::-moz-range-track {
            width: 12px;
            height: 100%;
            background: #1e2738;
            border-radius: 9999px;
        }

        .slider-vertical::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.5), 0 2px 4px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-black text-white h-screen flex flex-col overflow-hidden">
    <header class="flex justify-between px-4 py-2">
        <div class="flex items-center gap-3 ">
            <img src="./src/assets/img/note.jpg" alt="Logo" class="w-12 h-12 rounded-lg object-cover">
            <h1 class="text-xl font-bold tracking-tight text-white">Reproducción Musical</h1>
        </div>

        <div class="flex items-center gap-3">
            <button class="bg-neutral-900 rounded-full w-10 h-10 text-zinc-500"><i class="fa-solid fa-house"></i></button>
            <input type="text" placeholder="¿Qué quieres escuchar?" class="bg-neutral-900 rounded-full p-2 pl-8 min-w-96">
            <i class="fa-solid fa-magnifying-glass text-zinc-600 -ml-10"></i>
        </div>

        <div class="flex items-center gap-3">
            <button class="rounded-full p-2 px-5 cursor-pointer" style="background: linear-gradient(to bottom right, #ff1239, #5E3DFF);">Iniciar Sesión</button>
        </div>
    </header>

    <section class="flex-1 min-h-0 w-full  mx-auto grid grid-cols-4 grid-rows-[auto_1fr] gap-4 px-4">
        <div class="bg-neutral-900/50 col-span-1 p-5 rounded-lg shadow-md flex flex-col min-h-0">
            <h2 class="text-lg font-bold mb-3 text-white flex items-center gap-2">
                <i class="fa-brands fa-deezer"></i> Favoritas
            </h2>
            <ul class="flex-1 min-h-0 space-y-2 overflow-y-auto pr-2">
            </ul>
        </div>

        <div class="bg-neutral-900/50 col-span-2 p-5 rounded-lg shadow-md flex flex-col min-h-0">
            <h2 class="text-lg font-bold mb-3 text-white flex items-center gap-2">
                <i class="fa-solid fa-music"></i> Lista de Reproducción
            </h2>
            <ul id="list" class="flex-1 min-h-0 space-y-2 overflow-y-auto pr-2">
            </ul>
        </div>

        <!-- Panel Derecho: Sonando Ahora y Ecualizador -->
        <div id="right-panel" class="flex flex-col gap-4 min-h-0">
            <!-- Tarjeta: Sonando Ahora -->
            <div id="current-song"
                class="bg-neutral-900/50 p-4 rounded-lg shadow-md flex items-center gap-4">
                <img id="current-song-img" src="./src/assets/img/note.jpg" alt="Portada"
                    class="w-16 h-16 rounded-lg object-cover shadow flex-shrink-0">
                <div class="flex flex-col min-w-0">
                    <span class="text-[11px] font-bold tracking-wider text-purple-400 uppercase">SONANDO AHORA</span>
                    <h3 id="current-song-title" class="text-base font-bold text-white truncate leading-snug">Song Title
                    </h3>
                    <p id="current-song-artist" class="text-xs text-zinc-400 truncate">Artist Name</p>
                    <span id="current-song-genre"
                        class="self-start text-[11px] bg-zinc-700/80 text-zinc-300 px-2.5 py-0.5 rounded-full mt-1.5 font-medium">Género</span>
                </div>
            </div>

            <!-- Tarjeta: Ecualizador -->
            <div id="equalizer"
                class="bg-neutral-900/50 p-5 rounded-lg shadow-md flex-1 min-h-0 flex flex-col gap-3 justify-between">
                <!-- Cabecera -->
                <div class="flex items-center justify-between shrink-0">
                    <h3 class="font-bold text-white text-sm">Ecualizador</h3>
                    <span class="text-xs text-zinc-400 font-normal">espectro en vivo</span>
                </div>

                <!-- Espectro en vivo -->
                <div class="bg-black/30 rounded-lg p-2.5 border border-zinc-700/40 h-48 shrink-0 flex items-center justify-center overflow-hidden"
                    style="height: 192px; min-height: 192px;">
                    <canvas id="spectrum-canvas" class="w-full h-full block"></canvas>
                </div>

                <!-- Bandas: Graves, Medios, Agudos -->
                <div class="grid grid-cols-3 gap-2 flex-1 min-h-0">
                    <!-- Graves -->
                    <div
                        class="bg-black/30 border border-zinc-700/40 rounded-lg p-3 flex flex-col items-center justify-between min-h-0">
                        <span class="text-xs text-zinc-300 font-medium">Graves</span>
                        <div class="flex-1 w-full flex items-center justify-center my-1 min-h-0">
                            <input type="range" id="eq-bass" min="-12" max="12" value="0" step="1"
                                class="slider-vertical">
                        </div>
                        <span id="bass-val" class="text-[11px] text-zinc-400 font-mono">0 dB</span>
                    </div>

                    <!-- Medios -->
                    <div
                        class="bg-black/30 border border-zinc-700/40 rounded-lg p-3 flex flex-col items-center justify-between min-h-0">
                        <span class="text-xs text-zinc-300 font-medium">Medios</span>
                        <div class="flex-1 w-full flex items-center justify-center my-1 min-h-0">
                            <input type="range" id="eq-mid" min="-12" max="12" value="0" step="1"
                                class="slider-vertical">
                        </div>
                        <span id="mid-val" class="text-[11px] text-zinc-400 font-mono">0 dB</span>
                    </div>

                    <!-- Agudos -->
                    <div
                        class="bg-black/30 border border-zinc-700/40 rounded-lg p-3 flex flex-col items-center justify-between min-h-0">
                        <span class="text-xs text-zinc-300 font-medium">Agudos</span>
                        <div class="flex-1 w-full flex items-center justify-center my-1 min-h-0">
                            <input type="range" id="eq-treble" min="-12" max="12" value="0" step="1"
                                class="slider-vertical">
                        </div>
                        <span id="treble-val" class="text-[11px] text-zinc-400 font-mono">0 dB</span>
                    </div>
                </div>

                <!-- Restablecer -->
                <button id="reset-eq" class="shrink-0 w-full py-2 px-3 rounded-lg border border-zinc-700/80 hover:border-zinc-500 bg-neutral-900/60 hover:bg-zinc-700 text-zinc-300 hover:text-white text-xs font-medium transition cursor-pointer text-center">
                    Restablecer ecualizador
                </button>
            </div>
        </div>
    </section>

    <div class="w-full grid grid-cols-3 items-center bg-neutral-900/50  border-zinc-700/70 p-3 flex justify-center items-center flex-shrink-0 shadow-2xl">

        <div class="flex items-center gap-3 min-w-0">
            <img id="song-img" src="./src/assets/img/note.jpg" alt="Music Note"
                class="w-12 h-12 rounded-lg object-cover flex-shrink-0 shadow">
            <div class="min-w-0">
                <h3 id="song-title" class="text-sm font-semibold text-white truncate">Song Title</h3>
                <p id="song-author" class="text-xs text-zinc-400 truncate">By Unknown</p>
            </div>
        </div>

        <div class="space-y-2">
            <div id="controls" class="flex items-center justify-center gap-5">
                <button id="shuffle" class="text-sm text-zinc-400 hover:text-white transition cursor-pointer"
                    title="Aleatorio">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button id="previous" class="text-lg text-zinc-300 hover:text-white transition cursor-pointer"
                    title="Anterior">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="play"
                    class="text-3xl text-blue-500 hover:text-blue-400 hover:scale-105 active:scale-95 transition cursor-pointer"
                    title="Reproducir/Pausar">
                    <i class="fa-sharp fa-solid fa-circle-play"></i>
                </button>
                <button id="next" class="text-lg text-zinc-300 hover:text-white transition cursor-pointer"
                    title="Siguiente">
                    <i class="fa-sharp fa-solid fa-forward-step"></i>
                </button>
                <button id="repeat" class="text-sm text-zinc-400 hover:text-white transition cursor-pointer"
                    title="Repetir">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>

            <div class="w-full flex items-center justify-center gap-3">
                <small id="current-time" class="text-xs font-mono text-zinc-400 w-10 text-right">0:00</small>
                <input id="progress-bar" type="range" min="0" max="0" value="0"
                    class="w-full accent-blue-500 cursor-pointer h-1.5 bg-zinc-700 rounded-lg" />
                <small id="total-time" class="text-xs font-mono text-zinc-400 w-10">0:00</small>
            </div>
        </div>

        <!-- Controles de volumen -->
        <div id="volume-controls" class="flex items-center justify-end gap-3">
            <button id="mute-btn" class="text-zinc-400 hover:text-white transition cursor-pointer" title="Silenciar">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <input type="range" id="volume" min="0" max="1" value="0.2" step="0.1"
                class="w-24 accent-blue-500 cursor-pointer h-1.5 bg-zinc-700 rounded-lg">
            <small id="volume-value" class="text-xs font-mono text-zinc-400 w-4">2</small>
            <button>
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <script src="src/js/app.js"></script>
</body>

</html>
