<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Musical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-900 text-white h-screen">
    <div class="w-full absolute bottom-0 bg-gray-700 p-6 flex justify-center items-center space-y-9">
        <div class="w-full max-w-5xl space-y-3">
            <div class="w-full flex justify-center gap-2 px-4">
                <small id="current-time">0:00</small>
                <input id="progress-bar" type="range" min="0" max="0" value="0" class="w-full" />
                <small id="total-time">0:00</small>
            </div>
            <div class="grid grid-cols-3">
                <div class="flex items-center gap-2">
                    <img id="song-img" src="./src/assets/img/note.jpg" alt="Music Note" class="w-14 rounded-md">
                    <div>
                        <h3 id="song-title" class="text-md">Song Title</h3>
                        <p id="song-author" class="text-xs text-gray-400">By Unknown</p>
                    </div>
                </div>
                <div id="controls" class="flex items-center gap-5">
                    <button id="shuffle" class="text-sm text-gray-400">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button id="previous" class="text-lg">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="play" class="text-3xl">
                        <i class="fa-sharp fa-solid fa-circle-play"></i>
                    </button>
                    <button id="next" class="text-lg">
                        <i class="fa-sharp fa-solid fa-forward-step"></i>
                    </button>
                    <button id="repeat" class="text-sm text-gray-400">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>
                <div id="volume-controls" class="flex items-center gap-2">
                    <button id="mute-btn"><i class="fa-sharp fa-solid fa-volume-mute"></i></button>
                    <input type="range" id="volume" min="0" max="1" value="0.2" step="0.1">
                    <small id="volume-value">2</small>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <script src="src/js/app.js"></script>
</body>

</html>
